{% extends 'base.html' %}
{% block content %}
<h3>Edit Profile</h3>
<form method="POST" class="card card-body shadow-sm" style="max-width:500px">
  <div class="mb-3"><label class="form-label">Email</label>
    <input class="form-control" value="{{ current_user.email }}" disabled></div>
  <div class="mb-3"><label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ current_user.name }}" required></div>
  <div class="mb-3"><label class="form-label">Contact</label>
    <input name="contact" class="form-control" value="{{ current_user.contact or '' }}"></div>
  <div class="mb-3"><label class="form-label">New Password (khali chhodo agar badalna nahi)</label>
    <input type="password" name="password" class="form-control"></div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
