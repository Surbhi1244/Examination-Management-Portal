{% extends 'base.html' %}
{% block content %}
<h3>Reschedule Booking #{{ booking.id }}</h3>
<p class="text-muted">
  Student: {{ booking.student.name }} | Exam: {{ booking.slot.exam.name }} |
  Abhi: {{ booking.slot.date }} {{ booking.slot.start_time.strftime('%H:%M') }}
</p>
<form method="POST" class="card card-body shadow-sm" style="max-width:600px">
  <div class="mb-3">
    <label class="form-label">Naya slot</label>
    <select name="slot_id" class="form-select" required>
      {% for s in options %}
        <option value="{{ s.id }}">{{ s.date }} | {{ s.start_time.strftime('%H:%M') }}-{{ s.end_time.strftime('%H:%M') }} | {{ s.examiner.name }} | {{ s.available_seats }} seats</option>
      {% else %}
        <option value="">Koi dusra available slot nahi hai</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary" {{ 'disabled' if not options }}>Reschedule</button>
</form>
<a href="{{ url_for('admin_bookings') }}" class="btn btn-outline-secondary mt-3">Back</a>
{% endblock %}
