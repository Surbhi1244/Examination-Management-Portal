{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Courses</h3>
  <a href="{{ url_for('add_course') }}" class="btn btn-primary">+ Add Course</a>
</div>
<form class="mb-3 d-flex gap-2" method="GET">
  <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Search by name or code">
  <button class="btn btn-outline-secondary">Search</button>
</form>
<table class="table table-bordered bg-white">
  <thead class="table-light">
    <tr><th>ID</th><th>Code</th><th>Name</th><th>Status</th><th>Actions</th></tr>
  </thead>
  <tbody>
  {% for c in courses %}
    <tr>
      <td>{{ c.id }}</td><td>{{ c.code }}</td><td>{{ c.name }}</td>
      <td>{{ c.status }}</td>
      <td class="d-flex gap-2">
        <a href="{{ url_for('edit_course', cid=c.id) }}" class="btn btn-sm btn-warning">Edit</a>
        <form method="POST" action="{{ url_for('delete_course', cid=c.id) }}">
          <button class="btn btn-sm btn-danger">Delete</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="5" class="text-center">Koi course nahi mila.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
