{% extends 'base.html' %}
{% block content %}
<h3>Evaluate: {{ booking.student.name }}</h3>
<p class="text-muted">{{ booking.slot.exam.name }} | Max marks: {{ booking.slot.exam.max_marks }}</p>
<form method="POST" class="card card-body shadow-sm" style="max-width:700px">
  {% for r in rubrics %}
  <div class="mb-3">
    <label class="form-label">{{ r.criterion }} <small class="text-muted">(max {{ r.max_marks }})</small></label>
    <input type="number" step="0.5" min="0" max="{{ r.max_marks }}" name="r_{{ r.id }}"
           class="form-control"
           value="{{ scores[r.id].marks if r.id in scores else '' }}" required>
    {% if r.description %}<div class="form-text">{{ r.description }}</div>{% endif %}
  </div>
  {% endfor %}
  <div class="mb-3">
    <label class="form-label">Remarks</label>
    <textarea name="remarks" class="form-control" rows="3">{{ booking.remarks or '' }}</textarea>
  </div>
  <button class="btn btn-success">Submit Marks</button>
</form>
<a href="{{ url_for('slot_students', sid=booking.slot_id) }}" class="btn btn-outline-secondary mt-3">Back</a>
{% endblock %}
