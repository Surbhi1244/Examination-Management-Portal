{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Edit' if slot else 'Create' }} Slot</h3>
<form method="POST" class="card card-body shadow-sm" style="max-width:600px">
  {% if slot %}
    <p><strong>Exam:</strong> {{ slot.exam.name }}</p>
  {% else %}
    <div class="mb-3">
      <label class="form-label">Examination</label>
      <select name="exam_id" class="form-select" required>
        {% for e in exams %}
          <option value="{{ e.id }}">{{ e.name }} ({{ e.course.code }})</option>
        {% else %}
          <option value="">Abhi koi exam slot creation ke liye open nahi hai</option>
        {% endfor %}
      </select>
    </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">Date</label>
    <input type="date" name="date" class="form-control" value="{{ slot.date if slot else '' }}" required>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Start Time</label>
      <input type="time" name="start_time" class="form-control"
             value="{{ slot.start_time.strftime('%H:%M') if slot else '' }}" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">End Time</label>
      <input type="time" name="end_time" class="form-control"
             value="{{ slot.end_time.strftime('%H:%M') if slot else '' }}" required>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Maximum Student Capacity</label>
    <input type="number" name="capacity" min="1" class="form-control" value="{{ slot.capacity if slot else '' }}" required>
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
