{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Edit' if course else 'Add' }} Course</h3>
<form method="POST" class="card card-body shadow-sm" style="max-width:600px">
  <div class="mb-3">
    <label class="form-label">Course Code</label>
    <input name="code" class="form-control" value="{{ course.code if course else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Course Name</label>
    <input name="name" class="form-control" value="{{ course.name if course else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3">{{ course.description if course else '' }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Status</label>
    <select name="status" class="form-select">
      <option {{ 'selected' if course and course.status == 'Active' }}>Active</option>
      <option {{ 'selected' if course and course.status == 'Inactive' }}>Inactive</option>
    </select>
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
